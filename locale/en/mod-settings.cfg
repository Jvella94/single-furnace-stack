[mod-setting-description]
furnace-power-level-setting=Select the furnace power level for your game.
enable-debug-messages=Toggle verbose debug messages.
k2-remove-vanilla-smelting-recipes=If enabled, vanilla smelting recipes are removed when Krastorio 2 Spaced Out is active.
k2-remove-krastorio-smelting-recipes=If enabled, Krastorio smelting recipes are removed (only relevant if Krastorio 2 Spaced Out is active).
ingredient-amount-multiplier=Choose how many furnaces from the previous tier are required for the next.
furnace-to-assembling-machine-conversion=When enabled, all mod created furnace entities will be converted to assembling machines on game start allowing you to pick the recipe.